services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ytc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ytc}
      POSTGRES_DB: ${POSTGRES_DB:-ytc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    # No published port: Postgres is reached over the internal Compose network
    # (hostname `postgres`) by the app service only, never from the host or the
    # internet — matches Coolify's convention of not exposing backing services.
    # For local psql access use: docker compose exec postgres psql -U ytc ytc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ytc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ytc}:${POSTGRES_PASSWORD:-ytc}@postgres:5432/${POSTGRES_DB:-ytc}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_ENV: production
      PORT: "3000"
      # Coolify magic variable: leave unset for local `docker compose up`.
      # In Coolify, set a Domain for this service in its UI (or define
      # SERVICE_FQDN_APP_3000 here) — Coolify's proxy then terminates TLS and
      # routes that domain to the container's exposed port below.
      APP_URL: ${SERVICE_FQDN_APP_3000:-http://localhost:3000}
    volumes:
      - uploads-data:/app/data/uploads
    # No `ports:` mapping — Coolify (and any Traefik/Caddy-based reverse proxy)
    # routes to `expose`d ports over its internal network. For local
    # `docker compose up` without Coolify, add a `ports: ["3000:3000"]`
    # override in docker-compose.override.yaml instead of editing this file.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:
  uploads-data:
